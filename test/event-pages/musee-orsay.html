<meta name="description" content="Jeux géants, ateliers créatifs, lectures, podcasts… Pendant toute la période estivale, la salle des fêtes du musée d’Orsay se transforme en un espace de détente et de découverte, gratuit et ouvert à tous, sans réservation, du mardi au dimanche, de 10h à 17h." />
<meta name="abstract" content="Le musée d’Orsay vous invite à vivre une parenthèse culturelle et ludique dans le cadre somptueux de la salle des fêtes. Avec les Vacances à Orsay, le musée devient un espace de loisirs, de création et de jeu, où petits et grands sont les bienvenus pour profiter librement d’une programmation joyeuse et accessible à tous.Un programme pour toute la familleTout au long des vacances, venez explorer un univers d’activités conçues pour éveiller la curiosité, développer la créativité et partager un moment convivial au musée.© Musée d’Orsay / LAETITIA STRIFFLING-MARCU Laëtitia Striffling-MarcuAteliers créatifs inspirés des œuvres de la collectionLes enfants et leurs familles auront la possibilité de participer à un atelier autour des natures mortes de Paul Cezanne, de réinventer les personnages d&#039;un tableau, ou encore de laisser libre cours à leur imagination en prenant part à une fresque collective collectant leurs souvenirs du musée© Musée d’Orsay / LAETITIA STRIFFLING-MARCU Laëtitia Striffling-Marcu Lectures et temps calmes, pour se poser et rêverUn coin lecture sera aménagé pour offrir aux familles un moment de calme, des ouvrages en lien avec les œuvres du musée, permettront à chacun de s&#039;évader avant de repartir à la découverte des collections. © Musée d’Orsay / LAETITIA STRIFFLING-MARCU Laëtitia Striffling-MarcuApprendre en s’amusantQuoi de mieux qu’un jeu de l’oie géant ou de 7 familles revisité avec les personnages des tableaux du musée pour découvrir les collections tout en s&#039;amusant ? En complément des puzzles, memory et jeux de construction ou d’imitation seront disponibles.Podcasts jeune public Les Promenades imaginaires (en français uniquement)Les visiteurs pourront profiter pleinement de l’ensemble des podcasts jeune public du musée, confortablement installés dans une toute nouvelle station d’écoute. Au programme : Promenades imaginaires, un podcast destiné aux enfants dès 7 ans, écrit par Béatrice Fontanel en coproduction avec Création Collective. Inspirées des tableaux du musée, ces histoires transportent les jeunes auditeurs dans un voyage à travers le temps.© Musée d&#039;Orsay / Laëtitia Striffling-Marcu Cartes postales souvenirChacun pourra faire voyager autour du monde les Vacances à Orsay en écrivant et en envoyant gratuitement à la personne qu&#039;il souhaite une carte postale souvenir de son passage au musée. " />
